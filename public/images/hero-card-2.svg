<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" fill="none">
  <defs>
    <!-- Background Lavender / Periwinkle Gradients -->
    <linearGradient id="c2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad8f0"/>
      <stop offset="48%" stop-color="#e3e1f5"/>
      <stop offset="100%" stop-color="#cbcaeb"/>
    </linearGradient>

    <radialGradient id="c2-glow-light" cx="65%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ecebf9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#dad8f0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="c2-shadow-corner" cx="10%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#b6b2e2" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#c5c2ea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dad8f0" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Silk Wave Gradients -->
    <linearGradient id="c2-wave-surface" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#f5f5fe"/>
      <stop offset="70%" stop-color="#dedcf3"/>
      <stop offset="100%" stop-color="#b8b4e4"/>
    </linearGradient>

    <linearGradient id="c2-wave-fold" x1="30%" y1="20%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#eae9f8" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#c1bde7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9d98d4" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="c2-wave-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-8" dy="16" stdDeviation="22" flood-color="#807ba9" flood-opacity="0.25"/>
      <feDropShadow dx="12" dy="28" stdDeviation="28" flood-color="#5a5382" flood-opacity="0.18"/>
    </filter>

    <filter id="c2-soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="520" height="360" rx="40" ry="40" fill="url(#c2-bg)"/>
  <rect width="520" height="360" rx="40" ry="40" fill="url(#c2-glow-light)"/>
  <rect width="520" height="360" rx="40" ry="40" fill="url(#c2-shadow-corner)"/>

  <!-- Fluid 3D Wave / Ribbon Curves -->
  <g filter="url(#c2-wave-shadow)">
    <!-- Underlying Soft Ambient Wave -->
    <path d="M 80 370 C 140 240, 240 180, 360 160 C 430 148, 480 90, 530 20 L 530 370 Z" 
          fill="#b8b4e3" opacity="0.45" filter="url(#c2-soft-blur)"/>

    <!-- Main Elegant 3D Ribbon Body -->
    <path d="M 60 360 C 120 220, 230 150, 360 120 C 440 100, 485 50, 525 -10 L 535 220 C 480 270, 410 320, 310 350 C 230 374, 130 368, 60 360 Z" 
          fill="url(#c2-wave-surface)"/>

    <!-- Top Fold / Lit Crest -->
    <path d="M 160 360 C 230 250, 320 180, 430 130 C 475 110, 505 60, 530 10 C 515 50, 480 95, 435 125 C 335 190, 230 260, 160 360 Z" 
          fill="url(#c2-wave-fold)"/>

    <!-- Sharp White Specular Highlight on Ridge -->
    <path d="M 210 320 C 275 235, 360 170, 465 115 C 495 98, 518 60, 530 25 C 522 50, 500 85, 468 108 C 370 162, 280 230, 210 320 Z" 
          fill="#ffffff" opacity="0.85"/>

    <!-- Diffused Inner Ambient Glow -->
    <ellipse cx="370" cy="180" rx="110" ry="70" fill="#ffffff" opacity="0.4" filter="url(#c2-soft-blur)" transform="rotate(-18 370 180)"/>
  </g>
</svg>
