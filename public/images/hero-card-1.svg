<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="380" height="340" fill="none">
  <defs>
    <!-- Background Multi-stop Mesh / Linear Gradients -->
    <linearGradient id="c1-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#afc3cf"/>
      <stop offset="42%" stop-color="#b6dad6"/>
      <stop offset="70%" stop-color="#f8beaa"/>
      <stop offset="100%" stop-color="#f09677"/>
    </linearGradient>

    <radialGradient id="c1-teal" cx="15%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#69c8bf" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#8cd5cd" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#9ddcd6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="c1-peach" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#f18f6c" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f7b79e" stop-opacity="0.75"/>
      <stop offset="90%" stop-color="#fce2d6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="c1-sky" cx="30%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#c1d2de" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#cbdbe4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dce7ed" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Torus / Disc Shading -->
    <radialGradient id="torus-surface" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#f5e8dd"/>
      <stop offset="48%" stop-color="#d6beb0"/>
      <stop offset="75%" stop-color="#9d867c"/>
      <stop offset="100%" stop-color="#564a45"/>
    </radialGradient>

    <radialGradient id="torus-hole" cx="44%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#2a2422" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#4e433f" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#8a7970" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ab9c94" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="torus-highlight" x1="20%" y1="10%" x2="70%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="c1-torus-shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="14" dy="24" stdDeviation="20" flood-color="#2c3a44" flood-opacity="0.32"/>
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#3d2b24" flood-opacity="0.2"/>
    </filter>

    <filter id="c1-blur-ambient" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Card Background with Rounded Corners -->
  <rect width="380" height="340" rx="36" ry="36" fill="url(#c1-base)"/>
  <rect width="380" height="340" rx="36" ry="36" fill="url(#c1-teal)"/>
  <rect width="380" height="340" rx="36" ry="36" fill="url(#c1-peach)"/>
  <rect width="380" height="340" rx="36" ry="36" fill="url(#c1-sky)"/>

  <!-- 3D Disc / Torus Sculpture -->
  <g transform="translate(185, 168) rotate(-18)" filter="url(#c1-torus-shadow)">
    <!-- Outer 3D Smooth Disc -->
    <ellipse cx="0" cy="0" rx="104" ry="76" fill="url(#torus-surface)"/>

    <!-- Specular Highlight Arc -->
    <path d="M -80 -18 C -70 -52, -10 -68, 48 -54 C 20 -64, -50 -56, -80 -18 Z" fill="url(#torus-highlight)"/>
    <ellipse cx="-32" cy="-30" rx="36" ry="14" fill="#ffffff" opacity="0.6" filter="url(#c1-blur-ambient)" transform="rotate(-12)"/>

    <!-- Central Recess / Hole with Depth Shadow -->
    <ellipse cx="6" cy="4" rx="42" ry="28" fill="url(#torus-hole)"/>
    <ellipse cx="6" cy="4" rx="36" ry="23" fill="#38302c" opacity="0.45"/>
    <ellipse cx="8" cy="7" rx="30" ry="18" fill="#1f1a18" opacity="0.6"/>

    <!-- Inner Rim Highlight opposite light -->
    <path d="M -18 16 C -4 24, 22 24, 38 14 C 24 20, 0 20, -18 16 Z" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
